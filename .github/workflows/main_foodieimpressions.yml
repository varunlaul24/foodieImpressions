# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - foodieImpressions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          # Install and build the Angular client (outputPath is ../server/public)
          cd client
          npm ci
          npm run build --if-present
          # npm run test --if-present --silent || true
          # Install server dependencies (server contains the Node/Express app)
          cd ../server
          npm ci
          # npm run test --if-present --silent || true
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # upload the server folder (it now contains the built client in server/public)
          path: server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2C2CBA46E4664E359BA74EDB35CADAA9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FAB39A6F97B848EDB42A3B837EEE5812 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D80637DCF0F640BAA73AB40DB084391A }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'foodieImpressions'
          slot-name: 'Production'
          package: .
